# Workflow for auto-merging Dependabot PRs
# Uses the ioBroker auto-merge action, which waits for the test workflow and
# applies the rules of .github/auto-merge.yml.

name: Auto-Merge Dependabot PRs

on:
  # Trigger when a PR is opened or updated
  # pull_request instead of pull_request_target: GitHub blocks pull_request_target for PRs
  # from forks by default from 02.11.2026. Dependabot PRs get write access through
  # 'permissions' below.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if actor is dependabot
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Rules: development = minor (includes patch), package-lock only = minor (includes patch)
          config-file-path: '.github/auto-merge.yml'
          merge-method: 'squash'
          # Wait until the 'Test and Release' workflow has finished (default: true)
          wait-for-checks: 'true'
          max-wait-time: '3600'
